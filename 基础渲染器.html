      /* 更浅的蓝色 */
    }

    .level-3 {
      background-color: #d9faff;
      /* 更亮的蓝色 */
    }

    .node:hover,
    .leaf:hover {
      border-color: #00aaff;
      box-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
    }

    .node.level-1 {
      font-weight: bold;
    }

    .leaf.level-3 {
      font-style: italic;
      color: #0077aa;
    }

  function render(nodeTree, parent) {
  // 遍历节点树
  nodeTree.forEach(node => {
    // 1. 创建当前节点
    const el = document.createElement(node.type);

    // 2. 设置属性
    if (node.props) {
      Object.entries(node.props).forEach(([key, value]) => {
        el.setAttribute(key, value);
      });
    }

    // 3. 处理子节点（递归）
    if (typeof node.children === "string") {
      // 如果是文本节点，直接添加
      el.textContent = node.children;
    } else if (Array.isArray(node.children)) {
      // 递归挂载子节点
      render(node.children, el);
    }

    // 4. 将当前节点挂载到父节点
    parent.appendChild(el);
  });
}


  const nodeTree = [
    {
      id: 1,
      type: "div",
      props: { class: "node level-1" },
      children: [
        {
          id: 2,
          type: "div",

  render(nodeTree, app);
